name: Next.js CD

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH Client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to Server
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          
          sshpass -p "${{ secrets.EC2_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << EOF

            echo "Connected to remote server."
            echo "Deploying branch: ${BRANCH_NAME}"

            if [[ "${BRANCH_NAME}" == "main" ]]; then
              APP_PATH="/home/ubuntu/reconcile-ai-fe"
            elif [[ "${BRANCH_NAME}" == "staging" ]]; then
              APP_PATH="/home/ubuntu/stage"
            else
              echo "Unsupported branch: ${BRANCH_NAME}"
              exit 1
            fi

            cd "\$APP_PATH" || { echo "Failed to change directory"; exit 1; }

            echo "Fetching latest code..."
            git fetch origin
            git reset --hard origin/${BRANCH_NAME}

            echo "Stopping existing containers..."
            if [ -f "docker-compose.yml" ] || [ -f "docker-compose.yaml" ]; then
              docker compose down || true
              echo "Rebuilding and starting containers..."
              docker compose up -d --build
            else
              echo "⚠️ No docker-compose file found in \$APP_PATH"
              exit 1
            fi

            echo "✅ Deployment successful for branch: ${BRANCH_NAME}"
          EOF
