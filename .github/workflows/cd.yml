name: Next.js CD

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: reconcile
    timeout-minutes: 10
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: .

      - name: Transfer Artifact to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          source: "build-artifact.tar"
          target: "/tmp/build-artifact.tar"

      - name: Deploy and Restart Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              FE_PATH="/var/www/html/reconcile-ai-fe"
              PORT=3005
              PM2_NAME="reconcile-fe"
              URL="https://reconxi.com"
            else
              FE_PATH="/var/www/html/reconcile-ai-fe-dev"
              PORT=3006
              PM2_NAME="reconcile-fe-dev"
              URL="https://dev.reconxi.com"
            fi

            echo "Deploying to $FE_PATH on port $PORT ($URL)"

            cd $FE_PATH

            # Extract new build to a temporary folder
            mkdir -p $FE_PATH/tmp
            tar -xvf /tmp/build-artifact.tar -C $FE_PATH/tmp
            mv $FE_PATH/tmp/.next $FE_PATH/.next_new
            mv $FE_PATH/tmp/package.json $FE_PATH/package.json
            mv $FE_PATH/tmp/package-lock.json $FE_PATH/package-lock.json
            rm -rf $FE_PATH/tmp

            # Install dependencies
            npm ci

            # Swap new build into place instantly
            mv $FE_PATH/.next $FE_PATH/.next_old
            mv $FE_PATH/.next_new $FE_PATH/.next
            rm -rf $FE_PATH/.next_old

            # Reload PM2 process without downtime
            npx pm2 reload "$PM2_NAME"

            echo "Deployment completed successfully!"
