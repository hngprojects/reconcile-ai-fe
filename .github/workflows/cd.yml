name: Next.js CD

on:
  push:
    branches:
      - main
      - dev
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH Client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to Server
        run: |
          sshpass -p "${{ secrets.EC2_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'

            echo "Connected to remote server."

            BRANCH=$(basename "${GITHUB_REF}")

            if [[ "$BRANCH" == "main" ]]; then
              APP_PATH="/home/ubuntu/reconcile-ai-fe"
            elif [[ "$BRANCH" == "staging" ]]; then
              APP_PATH="/home/ubuntu/stage"
            else
              echo "Unsupported branch: $BRANCH"
              exit 1
            fi

            echo "Switching to $APP_PATH"
            cd "$APP_PATH" || { echo "Failed to change directory"; exit 1; }

            echo "Fetching latest code..."
            git fetch origin
            git reset --hard origin/$BRANCH
            git pull origin $BRANCH

            echo "Stopping existing containers..."
            docker compose down

            echo "Rebuilding and starting containers..."
            docker compose up -d --build

            echo "✅ Deployment successful for branch: $BRANCH"
          EOF
