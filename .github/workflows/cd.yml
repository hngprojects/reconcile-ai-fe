name: Deploy Next.js to EC2

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy and start application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            cd /var/www/html/reconcile-ai-fe

            # Reset any local changes
            git reset --hard HEAD
            git clean -fd
            git pull origin main --force

            # Install dependencies
            npm install -g pnpm  # Ensure pnpm is installed
            npm install

            # Kill any running process on port 3000
            sudo fuser -k 3000/tcp || true

            # Restart tmux session
            tmux kill-session -t reconcile-fe || true
            tmux new-session -d -s reconcile-fe 'PORT=3000 npm run dev'
