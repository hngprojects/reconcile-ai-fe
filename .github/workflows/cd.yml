name: Next.js CD

on:
  push:
    branches:
      - main
      - dev
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: Clear npm Cache and Dependencies
        run: pnpm store prune

      - name: Install Dependencies
        run: pnpm install

      - name: Generate .env file from example
        run: |
          echo "Generating .env based on branch"

          BRANCH_NAME="${GITHUB_REF##*/}"

          if [[ "$BRANCH_NAME" == "main" ]]; then
            export BASE_API_URL="https://api.reconxi.com/api/v1"
            export AUTH_URL="https://reconxi.com"
            export NEXT_PUBLIC_REVERB_APP_ID=891545
            export NEXT_PUBLIC_REVERB_APP_KEY=4bb0afzfzf4nmbstsjd4
            export NEXT_PUBLIC_REVERB_APP_SECRET=fboszhrecdm2qvtyhawc
            export NEXT_PUBLIC_REVERB_HOST="localhost"
            export NEXT_PUBLIC_REVERB_PORT=6005
            export NEXT_PUBLIC_REVERB_SCHEME=http
            export NEXT_PUBLIC_REVERB_URL=https://reconxi.com
          elif [[ "$BRANCH_NAME" == "dev" ]]; then
            export BASE_API_URL="https://api-dev.reconxi.com/api/v1"
            export AUTH_URL="https://dev.reconxi.com"
            export NEXT_PUBLIC_REVERB_APP_ID=681729
            export NEXT_PUBLIC_REVERB_APP_KEY=gydjyldygl6c8yn5fb5t
            export NEXT_PUBLIC_REVERB_APP_SECRET=cdxemfne0gqyvzbcfw09
            export NEXT_PUBLIC_REVERB_HOST="localhost"
            export NEXT_PUBLIC_REVERB_PORT=6006
            export NEXT_PUBLIC_REVERB_SCHEME=http
            export NEXT_PUBLIC_REVERB_URL=https://dev.reconxi.com
          elif [[ "$BRANCH_NAME" == "staging" ]]; then
            export BASE_API_URL="https://staging.reconxi.com/api/v1"
            export AUTH_URL="https://stage.reconxi.com"
            export NEXT_PUBLIC_REVERB_APP_ID=104086
            export NEXT_PUBLIC_REVERB_APP_KEY=b6jeajexulljsjb3mtim
            export NEXT_PUBLIC_REVERB_APP_SECRET=c6cchxbvn2o4m6ghxhec
            export NEXT_PUBLIC_REVERB_HOST="reverb.reconxi.com"
            export NEXT_PUBLIC_REVERB_PORT=443
            export NEXT_PUBLIC_REVERB_SCHEME=https
            export NEXT_PUBLIC_REVERB_URL=https://staging.reconxi.com
          else
            echo "Unknown branch: $BRANCH_NAME"
            exit 1
          fi

          export NEXT_PUBLIC_BASE_API_URL="$BASE_API_URL"
          export GA_ID="${{ secrets.GA_ID }}"
          export AUTH_GOOGLE_ID="${{ secrets.AUTH_GOOGLE_ID }}"
          export AUTH_GOOGLE_SECRET="${{ secrets.AUTH_GOOGLE_SECRET }}"
          export AUTH_SECRET="${{ secrets.AUTH_SECRET }}"

          envsubst < .env.example > .env
        shell: bash

      - name: Archive the project
        run: tar -cvf build-artifact.tar .

      - name: Copy build artifact to server
        run: |
          sshpass -p "${{ secrets.EC2_PASSWORD }}" scp -o StrictHostKeyChecking=no \
            build-artifact.tar ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/build-artifact.tar

      - name: Deploy inside Docker
        run: |
          sshpass -p "${{ secrets.EC2_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'

            echo "Connected to remote server."

            BRANCH=$(basename "${GITHUB_REF}")

            if [[ "$BRANCH" == "main" ]]; then
              CONTAINER="reconxi-fe"
            elif [[ "$BRANCH" == "dev" ]]; then
              CONTAINER="reconxi-fe-dev"
            else
              CONTAINER="reconxi-fe-staging"
            fi

            echo "Using container: $CONTAINER"

            docker cp ~/build-artifact.tar $CONTAINER:/app/

            docker exec -i $CONTAINER bash -c "
              cd /app &&
              tar -xvf build-artifact.tar &&
              rm -f build-artifact.tar &&
              git pull &&
              npm install &&
              npm run build
            "

            echo "✅ Deployment complete for $CONTAINER"
          EOF
