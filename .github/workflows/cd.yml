name: Next.js CD

on:
  workflow_run:
    workflows: ["Next.js CI"]
    types:
      - completed
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: reconcile
    timeout-minutes: 10
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: .

      - name: Deploy and Start Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              FE_PATH="/var/www/html/reconcile-ai-fe"
              PORT=3005
              PM2_NAME="reconcile-fe"
              URL="https://reconxi.com"
            else
              FE_PATH="/var/www/html/reconcile-ai-fe-dev"
              PORT=3006
              PM2_NAME="reconcile-fe-dev"
              URL="https://dev.reconxi.com"
            fi

            echo "Deploying to $FE_PATH on port $PORT ($URL)"

            cd $FE_PATH

            # Copy and extract build artifact
            mkdir -p $FE_PATH/tmp
            tar -xvf build-artifact.tar -C $FE_PATH/tmp
            mv $FE_PATH/tmp/.next $FE_PATH/.next_new
            rm -rf $FE_PATH/tmp

            # Pull latest code          
            git pull origin $(basename $GITHUB_REF)

            # Install Dependencies
            npm ci
            # Install PM2 if not available
            npm install pm2 --save-dev

            # Swap new build into place
            mv $FE_PATH/.next $FE_PATH/.next_old
            mv $FE_PATH/.next_new $FE_PATH/.next
            rm -rf $FE_PATH/.next_old

            # Restart or start PM2 process
            if npx pm2 list | grep -q "$PM2_NAME"; then
              npx pm2 reload "$PM2_NAME"
            else
              PORT=$PORT npx pm2 start npm --name "$PM2_NAME" -- run start
            fi

            npx pm2 save
            echo "Deployment completed successfully!"
