name: Deploy Next.js to EC2

on:
  # push:
  #   branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy and start application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |

            echo "${{ secrets.EC2_PASSWORD }}" | sudo -S chown -R $USER:$USER /var/www/html/reconcile-ai-fe

            # Set Git to use the directory as safe 
            git config --global --add safe.directory /var/www/html/reconcile-ai-fe

            cd /var/www/html/reconcile-ai-fe

            git pull origin main

            # Fix npm permissions using sudo
            echo "${{ secrets.EC2_PASSWORD }}" | sudo -S chown -R $USER:$USER /var/www/html/reconcile-ai-fe


            npm install

            npm run build

             # Reset ownership for web server
            echo "${{ secrets.EC2_PASSWORD }}" | sudo -S chown -R www-data:www-data /var/www/html/reconcile-ai-fe

            # Restart Nginx
            echo "${{ secrets.EC2_PASSWORD }}" | sudo -S systemctl restart nginx
