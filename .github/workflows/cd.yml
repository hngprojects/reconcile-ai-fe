name: Next.js Production CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: reconcile
    timeout-minutes: 10

    steps:
      - name: Deploy and Start Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            FE_PATH="/var/www/html/reconcile-ai-fe"
            PORT=3005
            PM2_NAME="reconcile-fe"
            URL="https://reconxi.com"

            echo "Deploying to $FE_PATH on port $PORT ($URL)"

            cd $FE_PATH

            # Reset and clean Git repository
            git reset --hard HEAD
            git clean -fd
            git pull origin main

            # Install dependencies
            npm install

            # Install PM2 locally if not installed
            npm install pm2 --save-dev

            # Restart or start PM2 process
            if npx pm2 list | grep -q "$PM2_NAME"; then
              npx pm2 restart "$PM2_NAME"
            else
              PORT=$PORT npx pm2 start npm --name "$PM2_NAME" -- run dev
            fi

            # Save PM2 process list
            npx pm2 save

            # Restart NGINX to apply changes
            sudo systemctl restart nginx

            echo "Production deployment completed successfully!"
