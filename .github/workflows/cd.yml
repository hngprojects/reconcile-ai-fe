name: Next.js CD

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy and Start Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              FE_PATH="/var/www/html/reconcile-ai-fe"
              PORT=3005
              URL="https://reconxi.com"
            else
              FE_PATH="/var/www/html/reconcile-ai-fe-dev"
              PORT=3006
              URL="https://dev.reconxi.com"
            fi

            echo "Deploying to $FE_PATH on port $PORT ($URL)"

            cd $FE_PATH

            # Reset and clean Git repository
            git reset --hard HEAD
            git clean -fd
            git pull origin $(basename $GITHUB_REF)

            # Install dependencies
            npm install

            # Install PM2 locally if not installed
            npm install pm2 --save-dev

            # Stop the previous instance if it exists
            npx pm2 delete reconcile-fe || true

            # Start the application with PM2
            PORT=$PORT npx pm2 start npm --name "reconcile-fe" -- run start

            # Save PM2 process list
            npx pm2 save

            # Restart NGINX to apply changes
            sudo systemctl restart nginx

            echo "Deployment completed successfully!"
