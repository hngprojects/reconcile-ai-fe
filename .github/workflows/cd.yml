name: Deploy Next.js to EC2

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy and start application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            cd /var/www/html/reconcile-ai-fe

            # Reset and clean Git repository
            git reset --hard HEAD
            git clean -fd
            git pull origin main

            # Install dependencies
            npm install

            # Install PM2 globally if not already installed
            npm install -g pm2 || true

            # Stop the previous instance if it exists
            pm2 stop reconcile-fe || true
            pm2 delete reconcile-fe || true

            # Start the application with PM2 
            pm2 start npm --name "reconcile-fe" -- run dev

            pm2 save

