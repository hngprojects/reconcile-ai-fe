name: Next.js CD

on: 
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: reconcile
    timeout-minutes: 10
    steps:
      - name: Copy the zipped folder into the server
        run: |
          scp -o StrictHostKeyChecking=no build-artifact.tar ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USERNAME }}/build-artifact.tar
        env:
          SSHPASS: ${{ secrets.EC2_PASSWORD }}
     

    steps:
      - name: Deploy and Start Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              FE_PATH="/var/www/html/reconcile-ai-fe"
              PORT=3005
              PM2_NAME="reconcile-fe"
              URL="https://reconxi.com"
            else
              FE_PATH="/var/www/html/reconcile-ai-fe-dev"
              PORT=3006
              PM2_NAME="reconcile-fe-dev"
              URL="https://dev.reconxi.com"
            fi

            echo "Deploying to $FE_PATH on port $PORT ($URL)"

            cd $FE_PATH

            # Copy and extract build artifact
            mkdir -p $FE_PATH/tmp
            tar -xvf /home/${{ secrets.EC2_USERNAME }}/build-artifact.tar -C $FE_PATH/tmp
            mv $FE_PATH/tmp/.next $FE_PATH/.next_new
            rm -rf $FE_PATH/tmp

            # Pull latest code          
            git pull origin $(basename $GITHUB_REF)

            # Install Dependencies
            npm ci
            npm install pm2 --save-dev

            # Build the project for production
            npm run build

            # Install PM2 locally if not installed
            npm install pm2 --save-dev

            # Restart or start PM2 process
            if npx pm2 list | grep -q "$PM2_NAME"; then
              npx pm2 restart "$PM2_NAME"
            else
              PORT=$PORT npx pm2 start npm --name "$PM2_NAME" -- run start
            fi

            # Save PM2 process list
            npx pm2 save



            echo "Deployment completed successfully!"
