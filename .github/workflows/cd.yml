name: Deploy Next.js to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy and start application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            # Allow Git to work inside the directory
            echo "${{ secrets.EC2_PASSWORD }}" | sudo -S git config --global --add safe.directory /var/www/html/reconcile-ai-fe

            cd /var/www/html/reconcile-ai-fe

            echo "${{ secrets.EC2_PASSWORD }}" | sudo -S git pull origin main

            # Set correct permissions for deployment
            echo "${{ secrets.EC2_PASSWORD }}" | sudo -S chown -R $USER:$USER /var/www/html/reconcile-ai-fe
            echo "${{ secrets.EC2_PASSWORD }}" | sudo -S chmod -R 775 /var/www/html/reconcile-ai-fe

            npm install

            npm run build

            # Fix permissions for .next directory
            echo "${{ secrets.EC2_PASSWORD }}" | sudo -S chown -R www-data:www-data /var/www/html/reconcile-ai-fe/.next
            echo "${{ secrets.EC2_PASSWORD }}" | sudo -S chmod -R 755 /var/www/html/reconcile-ai-fe/.next

            # Kill existing tmux session (if any)
            tmux send-keys -t 0 C-c

            tmux attach -t 0

            # Restart Nginx
            echo "${{ secrets.EC2_PASSWORD }}" | sudo -S systemctl restart nginx
