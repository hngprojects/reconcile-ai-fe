name: Next.js CD

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: reconcile
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js App
        run: npm run build

      - name: Archive the build folder
        run: tar -cvf build-artifact.tar .next

      - name: Copy the build artifact to the server
        run: |
          scp -o StrictHostKeyChecking=no build-artifact.tar ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USERNAME }}/build-artifact.tar

      - name: Deploy and Start Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              FE_PATH="/var/www/html/reconcile-ai-fe"
              PORT=3005
              PM2_NAME="reconcile-fe"
              URL="https://reconxi.com"
            else
              FE_PATH="/var/www/html/reconcile-ai-fe-dev"
              PORT=3006
              PM2_NAME="reconcile-fe-dev"
              URL="https://dev.reconxi.com"
            fi

            echo "Deploying to $FE_PATH on port $PORT ($URL)"

            cd $FE_PATH

            # Extract build artifact directly to .next
            tar -xvf /home/${{ secrets.EC2_USERNAME }}/build-artifact.tar -C $FE_PATH

            # Pull latest code          
            git pull origin $(basename $GITHUB_REF)

            # Install Dependencies
            npm ci
            npm install pm2 --save-dev

            # Restart or start PM2 process
            if npx pm2 list | grep -q "$PM2_NAME"; then
              npx pm2 reload "$PM2_NAME"
            else
              PORT=$PORT npx pm2 start npm --name "$PM2_NAME" -- run start
            fi

            npx pm2 save
            echo "Deployment completed successfully!"
