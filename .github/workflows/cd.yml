name: Deploy Next.js to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy and start application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            cd /var/www/html/reconcile-ai-fe

            # Reset and clean Git repository
            git reset --hard HEAD
            git clean -fd
            git pull origin main

            # Install dependencies
            npm install

            # Install PM2 locally if not already installed
            npm install pm2 --save-dev

            # Stop the previous instance if it exists
            npx pm2 delete reconcile-fe

            # Start the application with PM2 
            PORT=3005 npx pm2 start npm --name "reconcile-fe" -- run dev

            npx pm2 save
