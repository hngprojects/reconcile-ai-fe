name: Next.js CI/CD to EC2 Nginx

on:
  #   push:
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js for static export
        run: npm run build

      - name: Create directory structure
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            mkdir -p /var/www/html/reconsile-ai-fe

      - name: Deploy to EC2 Nginx directory
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          source: "out/*"
          target: "/var/www/html/reconsile-ai-fe"
          strip_components: 1
          overwrite: true

      - name: Set permissions and restart Nginx
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          script: |
            sudo chown -R www-data:www-data /var/www/html/reconsile-ai-fe
            sudo chmod -R 755 /var/www/html/reconsile-ai-fe
            sudo systemctl restart nginx
