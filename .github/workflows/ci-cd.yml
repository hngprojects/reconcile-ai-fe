name: CI/CD Pipeline
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build Next.js app
        run: npm run build
        
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            .next
            package.json
            next.config.ts
          retention-days: 1
          
      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          
      - name: Deploy
        run: npm run start
