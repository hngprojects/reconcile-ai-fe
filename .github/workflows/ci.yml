name: Next.js CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: reconcile
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Dependencies
        run: npm install

      - name: Run Linting
        run: npm run lint
