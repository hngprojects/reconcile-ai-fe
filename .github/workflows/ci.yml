name: Next.js CI

on:
  pull_request:
    branches: [main, dev]
  pull_request_target:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: reconcile
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Dependencies
        run: 
          npm install          

      - name: Run Linting
        run: npm run lint

      - name: Run Build
        run: npm run build

      - name: Archive Build Artifact
        run: tar -cvf build-artifact.tar .next

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build-artifact.tar
          
